name: Pol Cloud Autonomous Daemon
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pol_engine.py"
permissions:
  contents: write
jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloud Repo
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute Pol Cloud Optimization Cycle
        run: python pol_engine.py
      - name: Commit and Push Live Dashboard and SEO Assets
        run: |
          git config user.name "Pol Cloud Daemon"
          git config user.email "actions@github.com"
          git add *.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard, pricing & SEO pages" && git push)
